# Railway config-as-code: https://docs.railway.com/guides/config-as-code
# Link Postgres to this service and set DATABASE_URL (reference ${{Postgres.DATABASE_URL}}).

[build]
builder = "NIXPACKS"
# Optional: set NIXPACKS_NODE_VERSION=22 on the service if the build uses an older Node.

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy && npm run start'"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
