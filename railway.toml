# Railway config-as-code: https://docs.railway.com/guides/config-as-code
# Link Postgres to this service and set DATABASE_URL (reference ${{Postgres.DATABASE_URL}}).

[build]
builder = "RAILPACK"
# Node version: see railpack.json (packages.node) or package.json engines.

[deploy]
# Migrations before the new revision goes live; keeps `next start` fast for healthchecks.
preDeployCommand = "npx prisma migrate deploy"
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
